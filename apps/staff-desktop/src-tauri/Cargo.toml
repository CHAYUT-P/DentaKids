[package]
name = "denta-kids-staff"
version = "0.1.0"
description = "Denta Kids staff console — Tauri shell on the hosted /staff web app"
authors = ["Denta Kids"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "staff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Thai national ID cards through any PC/SC smart-card reader (WinSCard on Windows, PCSC on macOS)
pcsc = "2"
# auto-update: checks the published latest.json, verifies the signature, installs, restarts
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
