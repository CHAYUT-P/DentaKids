# Builds the staff desktop app (Denta Kids Staff) for Windows, publishes it,
# and makes it the version clinic PCs update to (docs/design/07-auto-update.md).
#
# Run it from GitHub → Actions → "Staff app (Windows)" → Run workflow, or with
#   gh workflow run staff-app-windows.yml -f notes="what changed"
#
# One app for both editions: which screens a clinic sees is STAFF_EDITION on
# the server, so moving to the full edition needs no new build or install.
#
# This repository is private, so installers go to the public repository
# CHAYUT-P/DentaKids-releases (installers only — no code, no secrets: no PIN
# is baked in; the app asks for the clinic PIN the first time on each PC).
# Every PC already installed checks stable/latest.json there and offers the
# update; a new PC downloads the .exe from that repository's Releases.
#
# Needs three secrets in this repository (one-time setup, see design/07):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — signs updates
#   RELEASES_TOKEN — a fine-grained token allowed to write to DentaKids-releases
name: Staff app (Windows)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown to staff in the update bar)"
        type: string
        default: "ปรับปรุงและแก้ไขข้อผิดพลาด"

permissions:
  contents: read

env:
  RELEASES_REPO: DentaKids-releases
  VERSION: 0.1.${{ github.run_number }}
  TAG: staff-windows-${{ github.run_number }}
  # the update channel installed PCs read
  CHANNEL: stable

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/staff-desktop/src-tauri -> target

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # every build gets its own, higher version (0.1.<run>) — that is what
      # tells an installed app there is something newer; and only builds made
      # here produce the signed update files
      - name: Set version, turn on update files
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const f = "apps/staff-desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.env.VERSION;
            c.bundle = { ...c.bundle, createUpdaterArtifacts: true };
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '

      - name: Build, sign and publish the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/staff-desktop
          tauriScript: pnpm tauri
          args: --bundles nsis
          owner: CHAYUT-P
          repo: ${{ env.RELEASES_REPO }}
          releaseCommitish: main
          tagName: ${{ env.TAG }}
          releaseName: "Denta Kids Staff (Windows) ${{ env.VERSION }}"
          releaseBody: |
            ${{ inputs.notes }}

            Windows installer for the staff app. PCs that already have the app update themselves.
            New PC: download the `.exe` below, run it, and open "Denta Kids Staff" from the Start menu.
            Windows may warn "Windows protected your PC" because the app isn't signed with a paid certificate — choose "More info" → "Run anyway".
            The first time it opens, type the clinic PIN.
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false

      # what installed PCs read: stable/latest.json on the releases repo's
      # main branch. Pointing it back at an older version's file is the
      # rollback for a bad release.
      - name: Offer this version to the clinic PCs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release download "$TAG" -R "CHAYUT-P/$RELEASES_REPO" -p latest.json -D upd
          # the staff see these notes in the update bar
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("upd/latest.json", "utf8"));
            j.notes = process.env.NOTES;
            fs.writeFileSync("upd/latest.json", JSON.stringify(j, null, 2));
          '
          git clone "https://x-access-token:${GH_TOKEN}@github.com/CHAYUT-P/${RELEASES_REPO}.git" rel
          mkdir -p "rel/$CHANNEL"
          cp upd/latest.json "rel/$CHANNEL/latest.json"
          cd rel
          git config user.name "dentakids-release"
          git config user.email "dentakids-release@users.noreply.github.com"
          git add "$CHANNEL/latest.json"
          git commit -m "$CHANNEL: offer $VERSION"
          git push
